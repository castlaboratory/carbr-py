[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carbr"
version = "0.1.0"
description = "Imóveis do Cadastro Ambiental Rural (CAR) no Python, sem baixar a base inteira"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "André Leite", email = "leite@castlab.org" },
    { name = "Marcos Wasiliew", email = "marcos.wasiliew@gmail.com" },
    { name = "Hugo Vasconcelos", email = "hugo.vasconcelos@ufpe.br" },
    { name = "Carlos Amorim", email = "carlos.agaf@ufpe.br" },
    { name = "Diogo Bezerra", email = "diogo.bezerra@ufpe.br" },
    { name = "Hortênsia Nunes Braz de Oliveira", email = "hortensia.nunes@condepefidem.pe.gov.br" },
]
keywords = ["CAR", "Sicar", "Brazil", "rural", "environment", "geoparquet", "open-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "duckdb>=1.1",
    "pandas>=1.3",
    "requests>=2.25",
    "platformdirs>=3",
]

[project.optional-dependencies]
geo = ["geopandas>=1.0"]
test = ["pytest>=7", "geopandas>=1.0"]
dev = ["pytest>=7", "geopandas>=1.0", "ruff>=0.6", "build>=1.0"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "matplotlib>=3.5", "geopandas>=1.0", "contextily>=1.5"]

[project.urls]
Homepage = "https://strategicprojects.github.io/carbr-py/"
Documentation = "https://strategicprojects.github.io/carbr-py/"
Repository = "https://github.com/StrategicProjects/carbr-py"
Issues = "https://github.com/StrategicProjects/carbr-py/issues"
Changelog = "https://github.com/StrategicProjects/carbr-py/blob/main/NEWS.md"

[tool.hatch.build.targets.wheel]
packages = ["src/carbr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: reads the public bucket (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
